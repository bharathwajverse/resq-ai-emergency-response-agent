services:
  - type: web
    name: resq-ai-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: resq-ai-db
          property: connectionString
      - key: SQLITE_FALLBACK
        value: "false"
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://resq-ai.vercel.app

databases:
  - name: resq-ai-db
    plan: free
    databaseName: resqai
